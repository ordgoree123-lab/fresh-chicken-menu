
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c8102e">
  <title>Fresh Chicken | المنيو الإلكتروني</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f8f8f8;
      color: #222;
    }

    header {
      background: white;
      text-align: center;
      padding: 25px 15px;
      border-bottom: 3px solid #c8102e;
    }

    .logo {
      color: #c8102e;
      font-size: 32px;
      font-weight: bold;
    }

    header p {
      color: #777;
      margin-bottom: 0;
    }

    .hero {
      background: #c8102e;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .hero p {
      margin: 0;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 18px 12px;
      background: white;
    }

    .categories button {
      border: 1px solid #c8102e;
      background: white;
      color: #c8102e;
      padding: 10px 18px;
      border-radius: 25px;
      white-space: nowrap;
      font-size: 15px;
      cursor: pointer;
    }

    .categories button.active {
      background: #c8102e;
      color: white;
    }

    main {
      padding: 20px 15px 100px;
      max-width: 900px;
      margin: auto;
    }

    .section-title {
      color: #c8102e;
      font-size: 22px;
      margin-bottom: 18px;
    }

    .empty {
      text-align: center;
      background: white;
      border-radius: 15px;
      padding: 35px 15px;
      color: #777;
    }

    .cart-bar {
      position: fixed;
      bottom: 0;
      right: 0;
      left: 0;
      background: #c8102e;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Fresh Chicken</div>
    <p>الطعم الذي تحبه ❤️</p>
  </header>

  <section class="hero">
    <h1>أهلاً بكم في Fresh Chicken</h1>
    <p>اكتشفوا أشهى وجبات الدجاج والوجبات المميزة</p>
  </section>

  <nav class="categories">
    <button class="active">الكل</button>
    <button>كنتاكي</button>
    <button>بيتزا</button>
    <button>شاورما</button>
    <button>برغر</button>
    <button>ساندويش</button>
    <button>فرايز</button>
    <button>ريزو</button>
    <button>مقبلات</button>
  </nav>

  <main>
    <h2 class="section-title">قائمة الطعام 🍗</h2>

    <div class="empty">
      <h3>قريباً نعرض لكم أشهى وجباتنا</h3>
      <p>نعمل الآن على تجهيز قائمة الطعام والأسعار.</p>
    </div>
  </main>

  <div class="cart-bar">
    🛒 سلة الطلبات — 0 د.ع
  </div>

  <footer>
    جميع الحقوق محفوظة © Fresh Chicken
  </footer>

</body>
</html>
